<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Кинотеатр "Ранхигс-Кино"{% endblock %}</title>
    <link rel="icon" type="image/webp" href="{{ url_for('static', filename='favicon.webp') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500&family=Unbounded:wght@600;700&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    {% block styles %}{% endblock %}
</head>
<body>
    <header>
        <a class="logo" href="{{ url_for('index') }}">
            <img src="{{ url_for('static', filename='favicon.webp') }}" alt="Ранхигс-Кино" class="logo-img">
            <span class="logo-text">Ранхигс-Кино</span>
        </a>
        <nav>
            <a href="{{ url_for('index') }}">Главная</a>
            <a href="{{ url_for('films') }}">Афиша</a>
            <a href="{{ url_for('schedule') }}">Расписание</a>
            <a href="{{ url_for('contacts') }}">Контакты</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
