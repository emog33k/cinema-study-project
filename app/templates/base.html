<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>{% block title %}Кинотеатр "Ранхигс-Кино"{% endblock %}</title>
    <link rel="icon" type="image/webp" href="{{ url_for('static', filename='favicon.webp') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500&family=Unbounded:wght@600;700&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    {% block styles %}{% endblock %}
</head>
<body>
    <header>
        <a class="logo" href="{{ url_for('index') }}">
            <img src="{{ url_for('static', filename='favicon.webp') }}" alt="Ранхигс-Кино" class="logo-img">
            <span class="logo-text">Ранхигс-Кино</span>
        </a>
        <nav>
            <a href="{{ url_for('index') }}">Главная</a>
            <a href="{{ url_for('films') }}">Афиша</a>
            <a href="{{ url_for('schedule') }}">Расписание</a>
            <a href="{{ url_for('contacts') }}">Контакты</a>
        </nav>
        <button class="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Включить тёмную тему" data-theme-toggle>
            <span class="theme-icon theme-icon-sun" aria-hidden="true">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"/></svg>
            </span>
            <span class="theme-icon theme-icon-moon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"/></svg>
            </span>
            <span class="theme-toggle-thumb" aria-hidden="true"></span>
        </button>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div>
            <strong>Ранхигс-Кино</strong>
            <p>Хорошее кино начинается с правильного сеанса.</p>
        </div>
        <div class="footer-contact">
            <span>Санкт-Петербург, Будапештская ул., 38</span>
            <a href="tel:+78121234567">+7 (812) 123-45-67</a>
            <a href="mailto:info@ranepa.ru">info@ranepa.ru</a>
        </div>
    </footer>

    <script>
        const themeToggle = document.querySelector('[data-theme-toggle]');
        const savedTheme = localStorage.getItem('theme');
        const preferredTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        const applyTheme = theme => {
            document.documentElement.dataset.theme = theme;
            const dark = theme === 'dark';
            themeToggle.setAttribute('aria-checked', String(dark));
            themeToggle.setAttribute('aria-label', dark ? 'Включить светлую тему' : 'Включить тёмную тему');
        };
        applyTheme(savedTheme === 'dark' || savedTheme === 'light' ? savedTheme : preferredTheme);

        themeToggle.addEventListener('click', () => {
            const theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
            applyTheme(theme);
            localStorage.setItem('theme', theme);
        });
    </script>
</body>
</html>
